name: deploy
on:
  push:
    branches: [main]
    paths-ignore: ['proofs/**']
  schedule:
    - cron: '23 5 * * *'     # daily rebuild refreshes likes/comment counts on the panels
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.166.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history: gitmeta + Hugo GitInfo need it
          submodules: recursive   # PaperMod
      - name: Install Hugo
        run: |
          curl -sSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" | tar -xz hugo
          sudo mv hugo /usr/local/bin/
      - name: Per-entry git metrics (start / commits / last modified)
        run: python3 tools/gitmeta.py
      - name: Likes & comment counts from Discussions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/social_counts.py
      - uses: actions/configure-pages@v5
      - name: Build
        run: hugo --minify
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
