baseURL: "https://sohum.blog/"
title: "Sohum's Blog"
theme: PaperMod
locale: en-us

enableGitInfo: true
enableRobotsTXT: true

permalinks:
  posts: /:year/:month/:day/:slug/    # preserves your WordPress URLs

outputs:
  home: [HTML, RSS, JSON]             # JSON feeds PaperMod's search page

taxonomies:
  tag: tags

pagination:
  pagerSize: 10

params:
  env: production
  # every single page (posts, pages, dossier stubs); override per page, or notice: false
  notice: >-
    Unless explicitly cited or specified otherwise, _everything_ here is my
    original creation.
  # homepage banner (falls back to notice if unset)
  homeNotice: >-
    I believe **everyone** should have an opportunity to present their thoughts
    and creations in their own _unfiltered_ voice. Thus, I have a policy
    regarding _everything_ in my blog: unless cited or specified otherwise,
    **everything here is my original creation**. Therefore, unless otherwise
    specified, I _never_ use AI for any content here. I extend the
    [same courtesy](https://nullaicreationshostedbysohum.com/) to AI.
  description: "Sohum's blog"
  defaultTheme: auto
  mainSections: [posts, x]            # x = diode section; sealed entries are excluded by _build, revealed ones surface here
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowShareButtons: false
  ShowBreadCrumbs: false
  ShowAllPagesInArchive: true
  comments: true                      # renders layouts/_partials/comments.html (giscus)
  giscus:                             # fill these four from https://giscus.app after installing the app
    repo: "sohumdatta/sohum.blog"
    repoId: "R_kgDOUfT97g"
    category: "Comments"
    categoryId: "DIC_kwDOUfT97s4DF1os"
    mapping: "pathname"
    inputPosition: "top"

menu:
  main:
    - { name: about,   url: /about/,    weight: 10 }
    - { name: archive, url: /archives/, weight: 20 }
    - { name: tags,    url: /tags/,     weight: 30 }
    - { name: search,  url: /search/,   weight: 40 }
